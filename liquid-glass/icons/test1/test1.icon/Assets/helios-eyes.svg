<svg xmlns="http://www.w3.org/2000/svg" width="322" height="167" viewBox="0 0 322 167">
  <defs>
    <linearGradient id="eyeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16D3F2"/>
      <stop offset="48%" stop-color="#08A9F2"/>
      <stop offset="100%" stop-color="#0869F6"/>
    </linearGradient>
    <linearGradient id="eyeHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left eye -->
  <rect x="0.5" y="0.5" width="90" height="166" rx="44.5"
        fill="url(#eyeGradient)" stroke="#0389DE" stroke-width="1"/>
  <rect x="4" y="4" width="83" height="158" rx="41.5"
        fill="url(#eyeHighlight)"/>

  <!-- Right eye -->
  <rect x="229.5" y="0.5" width="92" height="166" rx="45.5"
        fill="url(#eyeGradient)" stroke="#0389DE" stroke-width="1"/>
  <rect x="233" y="4" width="85" height="158" rx="42.5"
        fill="url(#eyeHighlight)"/>
</svg>
